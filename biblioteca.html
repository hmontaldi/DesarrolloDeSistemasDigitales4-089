
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Préstamos de Libros</title>

    <style>
        /* ESTILOS GENERALES */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        /* MENÚ PRINCIPAL */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        nav button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        nav button:hover {
            background-color: #2980b9;
        }

        /* CONTENEDOR DE LAS PANTALLAS */
        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .pantalla {
            display: none;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .pantalla.activa {
            display: block;
        }

        /* FORMULARIOS */
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #27ae60;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #219150;
        }

        .btn-devolver {
            margin: 0;
            background-color: #e67e22;
        }

        .btn-devolver:hover {
            background-color: #ca6f1e;
        }

        /* TABLAS */
        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        /* MENSAJES */
        .mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }

        .correcto {
            background-color: #d5f5e3;
            color: #176b3a;
        }

        .error {
            background-color: #fadbd8;
            color: #922b21;
        }

        .vacio {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO DEL SISTEMA -->
    <header>
        <h1>Biblioteca</h1>
        <p>Sistema de préstamos y devoluciones</p>
    </header>

    <!-- MENÚ PRINCIPAL -->
    <nav>
        <button onclick="mostrarPantalla('catalogo')">
            Catálogo
        </button>

        <button onclick="mostrarPantalla('prestamos')">
            Préstamos
        </button>

        <button onclick="mostrarPantalla('devoluciones')">
            Devoluciones
        </button>

        <button onclick="mostrarPantalla('historial')">
            Historial
        </button>
    </nav>

    <main>

        <!-- PANTALLA DEL CATÁLOGO -->
        <section id="catalogo" class="pantalla activa">

            <h2>Catálogo de libros</h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Libro</th>
                            <th>Autor</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="tablaLibros">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- PANTALLA PARA REGISTRAR PRÉSTAMOS -->
        <section id="prestamos" class="pantalla">

            <h2>Registrar préstamo</h2>

            <label for="alumno">
                Nombre y apellido:
            </label>

            <input
                type="text"
                id="alumno"
                placeholder="Ingrese nombre y apellido"
            >


            <label for="dni">
                DNI:
            </label>

            <input
                type="number"
                id="dni"
                placeholder="Ingrese DNI"
            >


            <label for="curso">
                Curso:
            </label>

            <input
                type="text"
                id="curso"
                placeholder="Ej: 4°B"
            >


            <label for="libroPrestamo">
                Libro:
            </label>

            <select id="libroPrestamo">
            </select>


            <label for="fechaPrestamo">
                Fecha del préstamo:
            </label>

            <input
                type="date"
                id="fechaPrestamo"
            >


            <button
                class="btn"
                onclick="registrarPrestamo()">

                Registrar préstamo

            </button>

            <div id="mensajePrestamo"></div>

        </section>


        <!-- PANTALLA DE DEVOLUCIONES -->
        <section id="devoluciones" class="pantalla">

            <h2>Devoluciones pendientes</h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Alumno</th>
                            <th>DNI</th>
                            <th>Curso</th>
                            <th>Libro</th>
                            <th>Fecha préstamo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="tablaDevoluciones">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- PANTALLA DEL HISTORIAL -->
        <section id="historial" class="pantalla">

            <h2>Historial de préstamos</h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Alumno</th>
                            <th>DNI</th>
                            <th>Curso</th>
                            <th>Libro</th>
                            <th>Fecha préstamo</th>
                            <th>Fecha devolución</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="tablaHistorial">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        /* DATOS INICIALES DE LOS LIBROS */

        let libros = [

            {
                nombre: "El Principito",
                autor: "Antoine de Saint-Exupéry",
                disponible: true
            },

            {
                nombre: "Don Quijote",
                autor: "Miguel de Cervantes",
                disponible: true
            },

            {
                nombre: "1984",
                autor: "George Orwell",
                disponible: true
            },

            {
                nombre: "Harry Potter",
                autor: "J. K. Rowling",
                disponible: true
            }

        ];


        /* LISTA DONDE SE GUARDAN LOS PRÉSTAMOS */

        let prestamos = [];


        /* CAMBIA ENTRE LAS DISTINTAS PANTALLAS */

        function mostrarPantalla(id) {

            let pantallas =
                document.querySelectorAll(".pantalla");


            pantallas.forEach(function(pantalla) {

                pantalla.classList.remove("activa");

            });


            document
                .getElementById(id)
                .classList.add("activa");


            actualizarCatalogo();

            actualizarListaLibros();

            actualizarHistorial();

            mostrarListaDevoluciones();
        }


        /* MUESTRA LOS LIBROS Y SU ESTADO */

        function actualizarCatalogo() {

            let tabla =
                document.getElementById("tablaLibros");


            tabla.innerHTML = "";


            libros.forEach(function(libro) {

                let estado =
                    libro.disponible
                    ? "Disponible"
                    : "Prestado";


                tabla.innerHTML += `

                    <tr>

                        <td>
                            ${libro.nombre}
                        </td>

                        <td>
                            ${libro.autor}
                        </td>

                        <td>
                            ${estado}
                        </td>

                    </tr>

                `;

            });

        }


        /* CARGA SOLAMENTE LOS LIBROS DISPONIBLES */

        function actualizarListaLibros() {

            let select =
                document.getElementById("libroPrestamo");


            select.innerHTML = "";


            let hayDisponibles = false;


            libros.forEach(function(libro, indice) {

                if (libro.disponible) {

                    hayDisponibles = true;


                    select.innerHTML += `

                        <option value="${indice}">

                            ${libro.nombre}

                        </option>

                    `;

                }

            });


            if (!hayDisponibles) {

                select.innerHTML =
                    `<option value="">
                        No hay libros disponibles
                    </option>`;

            }

        }


        /* REGISTRA UN NUEVO PRÉSTAMO */

        function registrarPrestamo() {

            let alumno =
                document.getElementById("alumno")
                .value
                .trim();


            let dni =
                document.getElementById("dni")
                .value
                .trim();


            let curso =
                document.getElementById("curso")
                .value
                .trim();


            let indiceLibro =
                document.getElementById("libroPrestamo")
                .value;


            let fecha =
                document.getElementById("fechaPrestamo")
                .value;


            let mensaje =
                document.getElementById("mensajePrestamo");


            /* VALIDAMOS LOS CAMPOS */

            if (
                alumno === "" ||
                dni === "" ||
                curso === "" ||
                fecha === ""
            ) {

                mensaje.innerHTML =
                    "Complete todos los campos.";

                mensaje.className =
                    "mensaje error";

                return;

            }


            /* BUSCAMOS EL LIBRO */

            let libro =
                libros[indiceLibro];


            if (
                !libro ||
                !libro.disponible
            ) {

                mensaje.innerHTML =
                    "Ese libro no está disponible.";

                mensaje.className =
                    "mensaje error";

                return;

            }


            /* CREAMOS EL PRÉSTAMO */

            let nuevoPrestamo = {

                alumno: alumno,

                dni: dni,

                curso: curso,

                libro: libro.nombre,

                fechaPrestamo: fecha,

                fechaDevolucion: "",

                estado: "Prestado"

            };


            /* GUARDAMOS EL PRÉSTAMO */

            prestamos.push(nuevoPrestamo);


            /* CAMBIAMOS EL ESTADO DEL LIBRO */

            libro.disponible = false;


            mensaje.innerHTML =
                "Préstamo registrado correctamente.";

            mensaje.className =
                "mensaje correcto";


            /* LIMPIAMOS LOS CAMPOS */

            document.getElementById("alumno").value = "";

            document.getElementById("dni").value = "";

            document.getElementById("curso").value = "";

            document.getElementById("fechaPrestamo").value = "";


            actualizarCatalogo();

            actualizarListaLibros();

            actualizarHistorial();

            mostrarListaDevoluciones();

        }


        /* MUESTRA LA LISTA DE PRÉSTAMOS PENDIENTES */

        function mostrarListaDevoluciones() {

            let tabla =
                document.getElementById(
                    "tablaDevoluciones"
                );


            tabla.innerHTML = "";


            let hayPrestamos = false;


            prestamos.forEach(function(
                prestamo,
                indice
            ) {

                if (
                    prestamo.estado === "Prestado"
                ) {

                    hayPrestamos = true;


                    tabla.innerHTML += `

                        <tr>

                            <td>
                                ${prestamo.alumno}
                            </td>

                            <td>
                                ${prestamo.dni}
                            </td>

                            <td>
                                ${prestamo.curso}
                            </td>

                            <td>
                                ${prestamo.libro}
                            </td>

                            <td>
                                ${prestamo.fechaPrestamo}
                            </td>

                            <td>

                                <button
                                    class="btn btn-devolver"
                                    onclick="registrarDevolucion(${indice})">

                                    Devolver

                                </button>

                            </td>

                        </tr>

                    `;

                }

            });


            if (!hayPrestamos) {

                tabla.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="vacio">

                            No hay préstamos pendientes.

                        </td>

                    </tr>

                `;

            }

        }


        /* REGISTRA LA DEVOLUCIÓN */

        function registrarDevolucion(indice) {

            let prestamo =
                prestamos[indice];


            /* OBTENEMOS LA FECHA ACTUAL */

            let hoy =
                new Date();


            let fecha =
                hoy
                .toISOString()
                .split("T")[0];


            /* ACTUALIZAMOS EL PRÉSTAMO */

            prestamo.fechaDevolucion =
                fecha;

            prestamo.estado =
                "Devuelto";


            /* BUSCAMOS EL LIBRO */

            let libro =
                libros.find(function(libro) {

                    return libro.nombre ===
                        prestamo.libro;

                });


            /* VOLVEMOS A DISPONER EL LIBRO */

            if (libro) {

                libro.disponible =
                    true;

            }


            actualizarCatalogo();

            actualizarListaLibros();

            actualizarHistorial();

            mostrarListaDevoluciones();

        }


        /* MUESTRA TODOS LOS PRÉSTAMOS EN EL HISTORIAL */

        function actualizarHistorial() {

            let tabla =
                document.getElementById(
                    "tablaHistorial"
                );


            tabla.innerHTML = "";


            if (prestamos.length === 0) {

                tabla.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="vacio">

                            Todavía no hay
                            préstamos registrados.

                        </td>

                    </tr>

                `;

                return;

            }


            prestamos.forEach(function(prestamo) {

                tabla.innerHTML += `

                    <tr>

                        <td>
                            ${prestamo.alumno}
                        </td>

                        <td>
                            ${prestamo.dni}
                        </td>

                        <td>
                            ${prestamo.curso}
                        </td>

                        <td>
                            ${prestamo.libro}
                        </td>

                        <td>
                            ${prestamo.fechaPrestamo}
                        </td>

                        <td>
                            ${prestamo.fechaDevolucion || "-"}
                        </td>

                        <td>
                            ${prestamo.estado}
                        </td>

                    </tr>

                `;

            });

        }


        /* INICIAMOS EL SISTEMA */

        actualizarCatalogo();

        actualizarListaLibros();

        actualizarHistorial();

        mostrarListaDevoluciones();

    </script>

</body>
</html>
